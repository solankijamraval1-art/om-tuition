<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Om Tuition - GSEB Std 9 & 10</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #0056b3;
            color: white;
            padding: 25px 10px;
        }
        h1 { margin: 0; font-size: 28px; }
        p.subtitle { margin-top: 8px; font-size: 16px; opacity: 0.9; }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-weight: bold;
            font-size: 18px;
            color: #0056b3;
        }
        footer {
            margin-top: 40px;
            padding: 15px;
            background: #222;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Om Tuition</h1>
        <p class="subtitle">GSEB ધોરણ 9 અને 10 ઓનલાઇન લર્નિંગ પ્લેટફોર્મ</p>
    </header>

    <div class="container">
        <h2>મુખ્ય વિષયો</h2>
        <div class="grid">
            <div class="card">📐 ગણિત</div>
            <div class="card">🔬 વિજ્ઞાન</div>
            <div class="card">🌍 સામાજિક વિજ્ઞાન</div>
            <div class="card">🇬🇧 અંગ્રેજી</div>
        </div>
    </div>

    <footer>
        &copy; 2026 Om Tuition | GSEB વિદ્યાર્થીઓ માટે
    </footer>

</body>
</html>
